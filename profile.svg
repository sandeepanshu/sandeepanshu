<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" role="img" aria-label="Sandeep Sharma">
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D9FF">
        <animate attributeName="stop-color" values="#00D9FF;#7C3AED;#FF6B9D;#00D9FF" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#7C3AED">
        <animate attributeName="stop-color" values="#7C3AED;#FF6B9D;#00D9FF;#7C3AED" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <clipPath id="avatarClip">
      <circle cx="150" cy="150" r="88"/>
    </clipPath>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="150" cy="150" r="92" fill="none" stroke="url(#ringGrad)" stroke-width="1.5" opacity="0.6">
    <animate attributeName="r" values="92;138" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.55;0" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="150" r="92" fill="none" stroke="url(#ringGrad)" stroke-width="1.5" opacity="0.6">
    <animate attributeName="r" values="92;138" dur="3.2s" begin="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.55;0" dur="3.2s" begin="1.6s" repeatCount="indefinite"/>
  </circle>

  <!-- AVATAR:START -->
  <circle cx="150" cy="150" r="88" fill="url(#bgGrad)"/>
  <text x="150" y="150" text-anchor="middle" dominant-baseline="central" font-family="Righteous, Trebuchet MS, sans-serif" font-size="64" font-weight="700" fill="url(#ringGrad)">SS</text>
  <!-- AVATAR:END -->

  <circle cx="150" cy="150" r="88" fill="none" stroke="url(#ringGrad)" stroke-width="3" filter="url(#glow)"/>

  <g transform="translate(150 150)">
    <circle r="103" fill="none" stroke="url(#ringGrad)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="50 28" opacity="0.9" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="11s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g transform="translate(150 150)">
    <circle r="117" fill="none" stroke="url(#ringGrad)" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="3 13" opacity="0.55">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="18s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g transform="translate(150 150)">
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite" additive="sum"/>
    <circle cx="0" cy="-103" r="5" fill="#00D9FF" filter="url(#glow)"/>
    <circle cx="89" cy="51" r="4" fill="#7C3AED" filter="url(#glow)"/>
    <circle cx="-89" cy="51" r="4" fill="#FF6B9D" filter="url(#glow)"/>
  </g>
</svg>
