<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200" role="img" aria-label="Sandeep Kumar Sharma">
  <defs>
    <linearGradient id="hb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/><stop offset="50%" stop-color="#141c2b"/><stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D9FF"><animate attributeName="stop-color" values="#00D9FF;#7C3AED;#FF6B9D;#00D9FF" dur="9s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#7C3AED"><animate attributeName="stop-color" values="#7C3AED;#FF6B9D;#00D9FF;#7C3AED" dur="9s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <pattern id="grid" width="45" height="40" patternUnits="userSpaceOnUse">
      <path d="M45 0 L0 0 0 40" fill="none" stroke="#00D9FF" stroke-width="0.5" opacity="0.13"/>
    </pattern>
    <clipPath id="hc"><rect width="900" height="200" rx="18"/></clipPath>
    <filter id="hg" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g clip-path="url(#hc)">
    <rect width="900" height="200" fill="url(#hb)"/>
    <rect width="900" height="200" fill="url(#grid)"/>
    <rect x="-160" y="0" width="160" height="200" fill="url(#acc)" opacity="0.09">
      <animate attributeName="x" values="-160;900" dur="7s" repeatCount="indefinite"/>
    </rect>
    <g transform="translate(772 100)">
      <circle r="58" fill="none" stroke="url(#acc)" stroke-width="2.5" stroke-dasharray="34 20" stroke-linecap="round" opacity="0.85" filter="url(#hg)">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
      </circle>
      <circle r="40" fill="none" stroke="url(#acc)" stroke-width="1.2" stroke-dasharray="3 11" opacity="0.6">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="16s" repeatCount="indefinite"/>
      </circle>
      <circle r="12" fill="url(#acc)" opacity="0.9" filter="url(#hg)">
        <animate attributeName="r" values="10;14;10" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
        <circle cx="0" cy="-58" r="4" fill="#00D9FF" filter="url(#hg)"/>
        <circle cx="50" cy="29" r="3.2" fill="#FF6B9D" filter="url(#hg)"/>
        <circle cx="-50" cy="29" r="3.2" fill="#7C3AED" filter="url(#hg)"/>
      </g>
    </g>
  </g>
  <rect x="0.75" y="0.75" width="898.5" height="198.5" rx="18" fill="none" stroke="url(#acc)" stroke-width="1.5" opacity="0.75"/>
  <text x="48" y="72" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" letter-spacing="1.5" fill="#e6edf3">SANDEEP KUMAR SHARMA</text>
  <rect x="48" y="86" height="3" rx="1.5" fill="url(#acc)">
    <animate attributeName="width" values="0;170;170;0" keyTimes="0;0.25;0.75;1" dur="6s" repeatCount="indefinite"/>
  </rect>
  <text x="48" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#00D9FF" opacity="0">Full-Stack Engineer — React + Node
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.30;0.33;1" dur="9s" repeatCount="indefinite"/>
  </text>
  <text x="48" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#7C3AED" opacity="0">Building the AI layer on real products
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.30;0.33;1" dur="9s" begin="3s" repeatCount="indefinite"/>
  </text>
  <text x="48" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#FF6B9D" opacity="0">LLM · RAG · Agentic Systems
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.30;0.33;1" dur="9s" begin="6s" repeatCount="indefinite"/>
  </text>
  <text x="48" y="162" font-family="Consolas, Menlo, monospace" font-size="13" fill="#8b949e">4+ yrs · BFSI &amp; SaaS · shipping to production</text>
</svg>
