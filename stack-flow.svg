<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-label="How I build">
  <defs>
    <linearGradient id="fa" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D9FF"><animate attributeName="stop-color" values="#00D9FF;#7C3AED;#FF6B9D;#00D9FF" dur="9s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#7C3AED"><animate attributeName="stop-color" values="#7C3AED;#FF6B9D;#00D9FF;#7C3AED" dur="9s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <filter id="fg" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="900" height="250" rx="16" fill="#0d1117"/>
  <rect x="0.75" y="0.75" width="898.5" height="248.5" rx="16" fill="none" stroke="url(#fa)" stroke-width="1.2" opacity="0.5"/>
  <text x="24" y="34" font-family="Consolas, Menlo, monospace" font-size="12" letter-spacing="3" fill="#8b949e">HOW I BUILD — REQUEST TO RESPONSE</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="15" y="58" width="150" height="82" rx="11" fill="#161b22" stroke="url(#fa)" stroke-width="1.6"/>
    <text x="90" y="90" text-anchor="middle" font-size="12" letter-spacing="2.5" fill="#00D9FF">CLIENT</text>
    <text x="90" y="112" text-anchor="middle" font-size="12.5" fill="#c9d1d9">React · Next.js</text>
    <text x="90" y="129" text-anchor="middle" font-size="11" fill="#8b949e">Redux · TypeScript</text>

    <rect x="255" y="58" width="150" height="82" rx="11" fill="#161b22" stroke="url(#fa)" stroke-width="1.6"/>
    <text x="330" y="90" text-anchor="middle" font-size="12" letter-spacing="2.5" fill="#00D9FF">API</text>
    <text x="330" y="112" text-anchor="middle" font-size="12.5" fill="#c9d1d9">Node · NestJS</text>
    <text x="330" y="129" text-anchor="middle" font-size="11" fill="#8b949e">REST · GraphQL</text>

    <rect x="495" y="58" width="150" height="82" rx="11" fill="#161b22" stroke="url(#fa)" stroke-width="1.6"/>
    <text x="570" y="90" text-anchor="middle" font-size="12" letter-spacing="2.5" fill="#FF6B9D">AI LAYER</text>
    <text x="570" y="112" text-anchor="middle" font-size="12.5" fill="#c9d1d9">LangChain · RAG</text>
    <text x="570" y="129" text-anchor="middle" font-size="11" fill="#8b949e">OpenAI · Agents</text>

    <rect x="735" y="58" width="150" height="82" rx="11" fill="#161b22" stroke="url(#fa)" stroke-width="1.6"/>
    <text x="810" y="90" text-anchor="middle" font-size="12" letter-spacing="2.5" fill="#00D9FF">DATA</text>
    <text x="810" y="112" text-anchor="middle" font-size="12.5" fill="#c9d1d9">Postgres · Redis</text>
    <text x="810" y="129" text-anchor="middle" font-size="11" fill="#8b949e">Vector Store</text>
  </g>

  <g stroke="#30363d" stroke-width="1.2">
    <line x1="165" y1="86" x2="255" y2="86"/><line x1="165" y1="115" x2="255" y2="115"/>
    <line x1="405" y1="86" x2="495" y2="86"/><line x1="405" y1="115" x2="495" y2="115"/>
    <line x1="645" y1="86" x2="735" y2="86"/><line x1="645" y1="115" x2="735" y2="115"/>
  </g>

  <g fill="#00D9FF" filter="url(#fg)">
    <circle r="3.6"><animateMotion path="M165,86 L255,86" dur="1.5s" repeatCount="indefinite"/></circle>
    <circle r="3.6"><animateMotion path="M165,86 L255,86" dur="1.5s" begin="0.75s" repeatCount="indefinite"/></circle>
    <circle r="3.6"><animateMotion path="M405,86 L495,86" dur="1.5s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle r="3.6"><animateMotion path="M405,86 L495,86" dur="1.5s" begin="1.05s" repeatCount="indefinite"/></circle>
    <circle r="3.6"><animateMotion path="M645,86 L735,86" dur="1.5s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle r="3.6"><animateMotion path="M645,86 L735,86" dur="1.5s" begin="1.35s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#FF6B9D" filter="url(#fg)">
    <circle r="3.2"><animateMotion path="M735,115 L645,115" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle r="3.2"><animateMotion path="M495,115 L405,115" dur="1.8s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle r="3.2"><animateMotion path="M255,115 L165,115" dur="1.8s" begin="1s" repeatCount="indefinite"/></circle>
  </g>

  <rect x="15" y="170" width="870" height="56" rx="11" fill="#161b22" stroke="url(#fa)" stroke-width="1.2" opacity="0.9"/>
  <text x="450" y="195" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11" letter-spacing="2.5" fill="#8b949e">RUNS ON</text>
  <text x="450" y="214" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#c9d1d9">Docker · Kubernetes · AWS (EC2 · EKS · S3) · Jenkins CI</text>
</svg>
