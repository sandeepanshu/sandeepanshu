<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 345" width="900" height="345" role="img" aria-label="AI and ML">
  <defs>
    <linearGradient id="aa" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D9FF"><animate attributeName="stop-color" values="#00D9FF;#7C3AED;#FF6B9D;#00D9FF" dur="9s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#7C3AED"><animate attributeName="stop-color" values="#7C3AED;#FF6B9D;#00D9FF;#7C3AED" dur="9s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <filter id="ag" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="900" height="345" rx="16" fill="#0d1117"/>
  <rect x="0.75" y="0.75" width="898.5" height="343.5" rx="16" fill="none" stroke="url(#aa)" stroke-width="1.2" opacity="0.5"/>
  <text x="24" y="32" font-family="Consolas, Menlo, monospace" font-size="12" letter-spacing="3" fill="#8b949e">AI / ML — SHIPPED vs STUDIED, KEPT SEPARATE</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="15" y="52" width="280" height="190" rx="11" fill="#161b22" stroke="url(#aa)" stroke-width="1.5"/>
    <circle cx="264" cy="74" r="4" fill="#3fb950"><animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/></circle>
    <text x="255" y="78" text-anchor="end" font-family="Consolas, Menlo, monospace" font-size="9" letter-spacing="1.5" fill="#3fb950">LIVE</text>
    <text x="30" y="78" font-size="12" letter-spacing="2" fill="#00D9FF">SHIPPED IN PRODUCTION</text>
    <line x1="30" y1="88" x2="280" y2="88" stroke="#30363d" stroke-width="1"/>
    <g font-size="12.5" fill="#c9d1d9">
      <text x="30" y="112">OpenAI API inside live product flows</text>
      <text x="30" y="133">Support chatbot + internal assistant</text>
      <text x="30" y="154">Content generation pipeline</text>
      <text x="30" y="175">Whisper output to sentiment dashboard</text>
      <text x="30" y="196" fill="#8b949e">~200-300 calls/day, Hindi + English</text>
      <text x="30" y="217" fill="#8b949e">Prompt design in real flows, not notebooks</text>
    </g>

    <rect x="310" y="52" width="280" height="190" rx="11" fill="#161b22" stroke="url(#aa)" stroke-width="1.5"/>
    <circle cx="559" cy="74" r="4" fill="#00D9FF"><animate attributeName="opacity" values="1;0.3;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <text x="550" y="78" text-anchor="end" font-family="Consolas, Menlo, monospace" font-size="9" letter-spacing="1.5" fill="#00D9FF">SOLID</text>
    <text x="325" y="78" font-size="12" letter-spacing="2" fill="#00D9FF">WORKING KNOWLEDGE</text>
    <line x1="325" y1="88" x2="575" y2="88" stroke="#30363d" stroke-width="1"/>
    <g font-size="12.5" fill="#c9d1d9">
      <text x="325" y="112">NumPy · Pandas · Matplotlib</text>
      <text x="325" y="133">scikit-learn · Statistics · Probability</text>
      <text x="325" y="154">Feature engineering</text>
      <text x="325" y="175">Deep learning fundamentals</text>
      <text x="325" y="196">LangChain · Prompt engineering</text>
      <text x="325" y="217">Embeddings · Vector DBs · Pydantic</text>
    </g>

    <rect x="605" y="52" width="280" height="190" rx="11" fill="#161b22" stroke="url(#aa)" stroke-width="1.5"/>
    <circle cx="854" cy="74" r="4" fill="#FF6B9D"><animate attributeName="r" values="3;5.5;3" dur="1.4s" repeatCount="indefinite"/></circle>
    <text x="845" y="78" text-anchor="end" font-family="Consolas, Menlo, monospace" font-size="9" letter-spacing="1.5" fill="#FF6B9D">IN PROGRESS</text>
    <text x="620" y="78" font-size="12" letter-spacing="2" fill="#FF6B9D">GOING DEEP NOW</text>
    <line x1="620" y1="88" x2="870" y2="88" stroke="#30363d" stroke-width="1"/>
    <g font-size="12.5" fill="#c9d1d9">
      <text x="620" y="112">RAG — chunk, retrieve, rerank, eval</text>
      <text x="620" y="133">LangGraph multi-agent orchestration</text>
      <text x="620" y="154">Transformers · Hugging Face</text>
      <text x="620" y="175">NLP · MCP</text>
      <text x="620" y="196">LLM app deployment</text>
      <text x="620" y="217" fill="#8b949e">Shipping projects as I go</text>
    </g>
  </g>

  <text x="24" y="268" font-family="Consolas, Menlo, monospace" font-size="10" letter-spacing="2.5" fill="#8b949e">THE RAG PATH I'M BUILDING ON</text>

  <g font-family="Consolas, Menlo, monospace" font-size="10" letter-spacing="1">
    <g stroke="#30363d" stroke-width="1.2">
      <line x1="130" y1="298" x2="145" y2="298"/><line x1="255" y1="298" x2="270" y2="298"/>
      <line x1="380" y1="298" x2="395" y2="298"/><line x1="505" y1="298" x2="520" y2="298"/>
      <line x1="630" y1="298" x2="645" y2="298"/><line x1="755" y1="298" x2="770" y2="298"/>
    </g>
    <rect x="20" y="282" width="110" height="32" rx="8" fill="#161b22" stroke="#30363d"/>
    <rect x="20" y="282" width="110" height="32" rx="8" fill="url(#aa)" opacity="0">
      <animate attributeName="opacity" values="0;0.30;0" dur="3.5s" begin="0s" repeatCount="indefinite"/></rect>
    <text x="75" y="302" text-anchor="middle" fill="#c9d1d9">QUERY</text>
    <rect x="145" y="282" width="110" height="32" rx="8" fill="#161b22" stroke="#30363d"/>
    <rect x="145" y="282" width="110" height="32" rx="8" fill="url(#aa)" opacity="0">
      <animate attributeName="opacity" values="0;0.30;0" dur="3.5s" begin="0.4s" repeatCount="indefinite"/></rect>
    <text x="200" y="302" text-anchor="middle" fill="#c9d1d9">CHUNK</text>
    <rect x="270" y="282" width="110" height="32" rx="8" fill="#161b22" stroke="#30363d"/>
    <rect x="270" y="282" width="110" height="32" rx="8" fill="url(#aa)" opacity="0">
      <animate attributeName="opacity" values="0;0.30;0" dur="3.5s" begin="0.8s" repeatCount="indefinite"/></rect>
    <text x="325" y="302" text-anchor="middle" fill="#c9d1d9">EMBED</text>
    <rect x="395" y="282" width="110" height="32" rx="8" fill="#161b22" stroke="#30363d"/>
    <rect x="395" y="282" width="110" height="32" rx="8" fill="url(#aa)" opacity="0">
      <animate attributeName="opacity" values="0;0.30;0" dur="3.5s" begin="1.2s" repeatCount="indefinite"/></rect>
    <text x="450" y="302" text-anchor="middle" fill="#c9d1d9">VECTOR DB</text>
    <rect x="520" y="282" width="110" height="32" rx="8" fill="#161b22" stroke="#30363d"/>
    <rect x="520" y="282" width="110" height="32" rx="8" fill="url(#aa)" opacity="0">
      <animate attributeName="opacity" values="0;0.30;0" dur="3.5s" begin="1.6s" repeatCount="indefinite"/></rect>
    <text x="575" y="302" text-anchor="middle" fill="#c9d1d9">RERANK</text>
    <rect x="645" y="282" width="110" height="32" rx="8" fill="#161b22" stroke="#30363d"/>
    <rect x="645" y="282" width="110" height="32" rx="8" fill="url(#aa)" opacity="0">
      <animate attributeName="opacity" values="0;0.30;0" dur="3.5s" begin="2s" repeatCount="indefinite"/></rect>
    <text x="700" y="302" text-anchor="middle" fill="#c9d1d9">LLM</text>
    <rect x="770" y="282" width="110" height="32" rx="8" fill="#161b22" stroke="#30363d"/>
    <rect x="770" y="282" width="110" height="32" rx="8" fill="url(#aa)" opacity="0">
      <animate attributeName="opacity" values="0;0.30;0" dur="3.5s" begin="2.4s" repeatCount="indefinite"/></rect>
    <text x="825" y="302" text-anchor="middle" fill="#c9d1d9">ANSWER</text>
  </g>
  <g fill="#00D9FF" filter="url(#ag)">
    <circle r="3"><animateMotion path="M130,298 L145,298" dur="3.5s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle r="3"><animateMotion path="M255,298 L270,298" dur="3.5s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle r="3"><animateMotion path="M380,298 L395,298" dur="3.5s" begin="1s" repeatCount="indefinite"/></circle>
    <circle r="3"><animateMotion path="M505,298 L520,298" dur="3.5s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle r="3"><animateMotion path="M630,298 L645,298" dur="3.5s" begin="1.8s" repeatCount="indefinite"/></circle>
    <circle r="3"><animateMotion path="M755,298 L770,298" dur="3.5s" begin="2.2s" repeatCount="indefinite"/></circle>
  </g>
</svg>
